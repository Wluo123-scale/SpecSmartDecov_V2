# SPECSMARTDECOV-V2-DO-NOT-TRAIN GUID eadc5a84-24e0-4e42-a8be-f4ec6a209378
name: Canary validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canary:
    name: canary markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: validate marker registry and covered source files
        run: python .github/scripts/check_canary.py
      - name: run validator regression tests
        run: python -m unittest tests/test_canary_check.py -v
